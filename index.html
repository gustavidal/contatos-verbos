<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Contatos</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="./app.js" defer type="module"></script>
</head>
<body>
    <div class="container">
        <h1>Contatos</h1>
        <p>Informe os dados abaixo para salvar um novo contato.</p>

        <div class="campo">
            <label>Nome</label>
            <label>Foto</label>
            <label>E-mail</label>
            <input type="text" placeholder="Ex: José de Maria" id="nome" required/>
            <input type="url" placeholder="Ex: https://jose-de-maria.jpg" id="foto" required/>
            <input type="email" placeholder="Ex: josedemaria@gmail.com" id="email" required/>
            <label>Celular</label>
            <label>Endereço</label>
            <label>Cidade</label>
            <input type="tel" placeholder="Ex: 11 9 0000-0000" id="celular" required/>
            <input type="text" placeholder="Ex: Galileia" id="endereco" required/>
            <input type="text" placeholder="Ex: Nazaré" id="cidade" required/>
        </div>

        <button id="salvar">Salvar</button>

        <div class="resultado">
            <p class="resultado-titulo">Contatos</p>
            <div class="tabela-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Foto</th>
                            <th>E-mail</th>
                            <th>Celular</th>
                            <th>Endereço</th>
                            <th>Cidade</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tbody">
                        <tr>
                            <td>1</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
